services:
  postgres:
    image: postgres:16-alpine
    container_name: condominio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Cria o database extra "evolution" no primeiro start (idempotente)
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/01-evolution-db.sql:ro
    networks: [condominio_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  evolution:
    image: atendai/evolution-api:v2.1.1
    container_name: condominio-evolution
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Auth
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      # Database (Postgres compartilhado, DB separado)
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution_exchange
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      # Cache local (sem Redis)
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      # Logs/limites
      LOG_LEVEL: "ERROR"
      QRCODE_LIMIT: "30"
      CONFIG_SESSION_PHONE_CLIENT: "Condominio"
      DEL_INSTANCE: "false"
      LANGUAGE: pt-BR
      TZ: ${TZ}
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    networks: [condominio_net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: condominio-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      evolution:
        condition: service_started
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      APP_URL: ${APP_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE}
      GDRIVE_SA_FILE: ${GDRIVE_SA_FILE}
      GDRIVE_ROOT_FOLDER_ID: ${GDRIVE_ROOT_FOLDER_ID}
      API_PORT: ${API_PORT}
      TZ: ${TZ}
    volumes:
      - ./secrets:/secrets:ro
    networks: [condominio_net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${API_PORT}/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:${API_PORT}
    container_name: condominio-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:${API_PORT}
      NEXT_PUBLIC_APP_URL: ${APP_URL}
      TZ: ${TZ}
    ports:
      - "127.0.0.1:${WEB_PORT}:3000"
    networks: [condominio_net]

volumes:
  pgdata:
  evolution_instances:
  evolution_store:

networks:
  condominio_net:
    driver: bridge
