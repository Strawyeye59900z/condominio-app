services:
  # Tailscale sidecar com auth-key pré-gerada para autenticação automática
  # Auth-key armazenada em TS_AUTHKEY (gere em: https://login.tailscale.com/admin/settings/keys)
  tailscale:
    image: tailscale/tailscale:stable
    container_name: condominio-tailscale
    hostname: condominio-api
    restart: unless-stopped
    # Executa em host network para que as rotas da tailnet fiquem disponíveis globalmente
    network_mode: "host"
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_EXTRA_ARGS: "--accept-routes --accept-dns=false"
      TZ: ${TZ}
    volumes:
      - ts_state:/var/lib/tailscale
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_MODULE

  postgres:
    image: postgres:16-alpine
    container_name: condominio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [condominio_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: condominio-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      tailscale:
        condition: service_started
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      APP_URL: ${APP_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      API_PORT: ${API_PORT}
      TZ: ${TZ}
    volumes:
      - ./uploads:/app/uploads
      - wa_auth:/app/auth_info_condominio
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${API_PORT}/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # API roda na rede bridge → acessar pelo container name
        API_INTERNAL_URL: http://condominio-api:${API_PORT}
    container_name: condominio-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://condominio-api:${API_PORT}
      NEXT_PUBLIC_APP_URL: ${APP_URL}
      TZ: ${TZ}
    ports:
      - "127.0.0.1:${WEB_PORT}:3000"
    networks: [condominio_net]

volumes:
  pgdata:
  wa_auth:
  ts_state:

networks:
  condominio_net:
    driver: bridge
